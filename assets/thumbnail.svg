<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2239"/>
      <stop offset="1" stop-color="#16304F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4A843"/>
      <stop offset="1" stop-color="#B8902F"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- faint network motif -->
  <g stroke="#2A4A70" stroke-width="1.5" opacity="0.5">
    <line x1="1050" y1="80" x2="1150" y2="150"/>
    <line x1="1150" y1="150" x2="1230" y2="90"/>
    <line x1="1150" y1="150" x2="1200" y2="240"/>
    <line x1="80" y1="560" x2="170" y2="500"/>
    <line x1="170" y1="500" x2="120" y2="430"/>
  </g>
  <g fill="#2A4A70">
    <circle cx="1050" cy="80" r="5"/><circle cx="1230" cy="90" r="4"/><circle cx="1200" cy="240" r="5"/>
    <circle cx="80" cy="560" r="5"/><circle cx="120" cy="430" r="4"/>
  </g>
  <g fill="#D4A843">
    <circle cx="1150" cy="150" r="6"/><circle cx="170" cy="500" r="6"/>
  </g>

  <!-- title -->
  <text x="90" y="132" font-family="'Helvetica Neue', Arial, sans-serif" font-size="84" font-weight="800" fill="#FFFFFF" letter-spacing="-2">wp-mcp</text>
  <text x="90" y="185" font-family="'Helvetica Neue', Arial, sans-serif" font-size="27" fill="#9FB4CC">Operate any WordPress site from Claude &#8212; content, plugins, themes, files.</text>
  <text x="90" y="222" font-family="'Helvetica Neue', Arial, sans-serif" font-size="27" fill="#9FB4CC">One revocable token per session. No SSH needed.</text>

  <!-- terminal card -->
  <g filter="url(#soft)">
    <rect x="90" y="285" width="470" height="240" rx="14" fill="#0B1A2E" stroke="#2A4A70"/>
    <rect x="90" y="285" width="470" height="40" rx="14" fill="#142B45"/>
    <rect x="90" y="311" width="470" height="14" fill="#142B45"/>
    <circle cx="118" cy="305" r="6" fill="#EF4444"/>
    <circle cx="140" cy="305" r="6" fill="#F59E0B"/>
    <circle cx="162" cy="305" r="6" fill="#10B981"/>
    <text x="325" y="311" text-anchor="middle" font-family="Menlo, monospace" font-size="14" fill="#5E7896">claude</text>
  </g>
  <g font-family="Menlo, 'Courier New', monospace" font-size="19">
    <text x="118" y="368" fill="#5E7896">$</text>
    <text x="140" y="368" fill="#E6EDF6">connect to mysite.com</text>
    <text x="118" y="404" fill="#D4A843">token</text>
    <text x="188" y="404" fill="#E6EDF6">wpmcp_&#183;&#183;&#183;&#183;&#183;&#183;&#183;&#183;&#183;&#183;&#183;&#183;</text>
    <text x="118" y="440" fill="#10B981">&#10003;</text>
    <text x="140" y="440" fill="#9FB4CC">connected &#8212; 18 tools</text>
    <text x="118" y="476" fill="#5E7896">$</text>
    <text x="140" y="476" fill="#E6EDF6">rebuild the board page</text>
    <rect x="404" y="461" width="11" height="19" fill="#D4A843">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- connection -->
  <line x1="592" y1="405" x2="684" y2="405" stroke="#D4A843" stroke-width="3.5" stroke-dasharray="9 7"/>
  <g>
    <rect x="588" y="378" width="102" height="0" fill="none"/>
    <polygon points="700,405 686,397 686,413" fill="#D4A843"/>
    <polygon points="575,405 589,397 589,413" fill="#D4A843"/>
  </g>
  <!-- token pill above the link -->
  <g filter="url(#soft)">
    <rect x="565" y="330" width="146" height="42" rx="21" fill="url(#gold)"/>
    <text x="638" y="357" text-anchor="middle" font-family="Menlo, monospace" font-size="17" font-weight="bold" fill="#0F2239">wpmcp_&#8226;&#8226;&#8226;&#8226;</text>
  </g>

  <!-- site card -->
  <g filter="url(#soft)">
    <rect x="715" y="285" width="475" height="240" rx="14" fill="#F7F8FA"/>
    <rect x="715" y="285" width="475" height="40" rx="14" fill="#E4E9F1"/>
    <rect x="715" y="311" width="475" height="14" fill="#E4E9F1"/>
    <rect x="815" y="297" width="270" height="17" rx="8.5" fill="#FFFFFF"/>
    <text x="950" y="310" text-anchor="middle" font-family="Menlo, monospace" font-size="12" fill="#64748B">https://mysite.com</text>
    <circle cx="743" cy="305" r="6" fill="#C9D2DE"/>
    <circle cx="765" cy="305" r="6" fill="#C9D2DE"/>
    <!-- wireframe: hero -->
    <rect x="740" y="346" width="425" height="64" rx="8" fill="#1B3A5C"/>
    <rect x="758" y="366" width="150" height="12" rx="6" fill="#D4A843"/>
    <rect x="758" y="386" width="220" height="8" rx="4" fill="#5E7896"/>
    <!-- wireframe: cards -->
    <g>
      <rect x="740" y="424" width="132" height="78" rx="8" fill="#FFFFFF" stroke="#E0E5EC"/>
      <rect x="886" y="424" width="132" height="78" rx="8" fill="#FFFFFF" stroke="#E0E5EC"/>
      <rect x="1032" y="424" width="132" height="78" rx="8" fill="#FFFFFF" stroke="#E0E5EC"/>
      <circle cx="806" cy="448" r="12" fill="#D4A843" opacity="0.35"/>
      <circle cx="952" cy="448" r="12" fill="#D4A843" opacity="0.35"/>
      <circle cx="1098" cy="448" r="12" fill="#D4A843" opacity="0.35"/>
      <rect x="762" y="468" width="88" height="7" rx="3.5" fill="#C9D2DE"/>
      <rect x="908" y="468" width="88" height="7" rx="3.5" fill="#C9D2DE"/>
      <rect x="1054" y="468" width="88" height="7" rx="3.5" fill="#C9D2DE"/>
      <rect x="762" y="482" width="60" height="7" rx="3.5" fill="#E0E5EC"/>
      <rect x="908" y="482" width="60" height="7" rx="3.5" fill="#E0E5EC"/>
      <rect x="1054" y="482" width="60" height="7" rx="3.5" fill="#E0E5EC"/>
    </g>
    <text x="1178" y="545" text-anchor="end" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#64748B"></text>
  </g>

  <!-- footer chips -->
  <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600">
    <rect x="90" y="560" width="215" height="40" rx="20" fill="none" stroke="#2A4A70"/>
    <text x="197" y="586" text-anchor="middle" fill="#9FB4CC">auto-backup + rescue</text>
    <rect x="321" y="560" width="222" height="40" rx="20" fill="none" stroke="#2A4A70"/>
    <text x="432" y="586" text-anchor="middle" fill="#9FB4CC">works on shared hosting</text>
    <rect x="559" y="560" width="150" height="40" rx="20" fill="none" stroke="#2A4A70"/>
    <text x="634" y="586" text-anchor="middle" fill="#9FB4CC">MCP server</text>
    <rect x="725" y="560" width="110" height="40" rx="20" fill="url(#gold)"/>
    <text x="780" y="586" text-anchor="middle" fill="#0F2239">v1.0.0</text>
  </g>
</svg>
